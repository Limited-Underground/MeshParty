plugins {
    id 'com.android.application' version '8.10.1'
}

def reportUrl = providers.gradleProperty('meshPartyReportUrl').orElse('').get()
def reportEndpoint = reportUrl.isEmpty() ? null : new URI(reportUrl)
def loopbackReports = reportEndpoint?.scheme == 'http' && reportEndpoint?.host == '127.0.0.1'
if (reportEndpoint != null && (
        (reportEndpoint.scheme != 'https' && !loopbackReports)
        || reportEndpoint.host == null
        || reportEndpoint.rawPath != '/v1/reports'
        || reportEndpoint.rawUserInfo != null
        || reportEndpoint.rawQuery != null
        || reportEndpoint.rawFragment != null
        || reportEndpoint.port == 0
        || reportEndpoint.port > 65535)) {
    throw new GradleException('meshPartyReportUrl must be an HTTPS /v1/reports URL or a debug loopback URL')
}

android {
    namespace 'com.limitedunderground.meshinbox'
    compileSdk 36

    defaultConfig {
        applicationId 'com.limitedunderground.meshparty'
        minSdk 31
        targetSdk 36
        versionCode 13
        versionName '0.2.3'
        buildConfigField 'String', 'ABUSE_REPORT_URL', groovy.json.JsonOutput.toJson(loopbackReports ? '' : reportUrl)
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            if (loopbackReports) {
                buildConfigField 'String', 'ABUSE_REPORT_URL', groovy.json.JsonOutput.toJson(reportUrl)
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // D-197: the in-app language choice needs every language in the installed app,
    // so Play bundles must not split by language.
    bundle {
        language {
            enableSplit = false
        }
    }

    lint {
        // A string missing from, or left over in, any language fails the build (D-197).
        error 'MissingTranslation', 'ExtraTranslation', 'MissingQuantity'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Host check that translated text fits a 360 dp screen (LanguageLayoutTest).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
